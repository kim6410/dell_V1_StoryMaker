---

인테리어 시각적 효과도 중요하지만 가장 뼈대가 되는 것은 완벽한 방수입니다.
3차에 걸친 꼼꼼한 하부 방수층 형성으로 누수 위험을 사전에 차단합니다.

---

하루 종일 머물고 싶은 고급스러운 질감과 톤을 구현합니다.
가족 모두의 안전과 안락함을 동시에 확보하는 맞춤형 자재 구성입니다.
---

이동 동선과 수납 용량을 최적화한 맞춤형 양변기 및 세면대 레이아웃입니다.
슬라이딩 거울 수납장과 간접 조명 설치로 실용성을 극대화합니다.
좁은 화장실도 두 배 더 넓어 보이게 만드는 구조 개선입니다.

필요하지 않은 시공을 억지로 권하지 않고 꼭 필요한 정직한 자재비만 산정합니다.
상세 내역이 모두 투명하게 공개되는 공정 견적서를 발행합니다.
시공 중간에 이유 없는 추가금을 요구하지 않는 원칙을 준수합니다.

## 7. 지금 바로 무료 출장 견적 상담을 받아보세요!
상담 번호인 ${phone}으로 전화 주시면 언제든지 신속히 방문해 드립니다.
부담 없는 맞춤형 진단으로 가장 합리적인 리모델링 대안을 찾아보세요.
화장실 인테리어 고민을 정직하고 완벽하게 해결해 드립니다.
`;
    }

    // 전송 처리
    async function handleSend() {
      const promptText = textarea.value.trim();
      if (!promptText) return;

      addChatMessage('user', promptText);
      textarea.value = '';
      sendBtn.disabled = true;
      stopBtn.style.display = 'inline-block';
      log("프롬프트 입력 완료. ChatGPT 생성 작동 시작...");

      setStatus('working');
      
      // 3초 후 답변 완성 시뮬레이션
      await new Promise(r => setTimeout(r, 3000));

      const generated = generateMockContent(promptText);
      addChatMessage('assistant', generated);

      sendBtn.disabled = false;
      stopBtn.style.display = 'none';
      setStatus(switchEl.checked ? 'polling' : 'idle');
      log("ChatGPT 답변 생성 완료!");

      // 자동화 상태였던 경우 백엔드에 결과 package 등록
      if (switchEl.checked && currentJobId) {
        await sendResultToBackend(currentJobId, currentProjectTitle, generated);
      }
    }

    function addChatMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      
      const avatarDiv = document.createElement('div');
      avatarDiv.className = 'avatar';
      avatarDiv.textContent = role === 'user' ? 'U' : 'GPT';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'content' + (role === 'assistant' ? ' markdown' : '');
      contentDiv.textContent = text;

      msgDiv.appendChild(avatarDiv);
      msgDiv.appendChild(contentDiv);
      chatHistory.appendChild(msgDiv);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    sendBtn.addEventListener('click', handleSend);

    // 자동화 관련 글로벌 상태
    let currentJobId = null;
    let currentProjectTitle = null;
    let lastMockedJobId = null;

    async function sendResultToBackend(jobId, projectTitle, resultText) {
      log(`[API/POST] result-package 전송 중... JobID: ${jobId}`);
      try {
        const response = await fetch('/api/test/result-package', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            job_id: jobId,
            project_title: projectTitle,
            source: 'firefox-worker',
            result_text: resultText,
            result_json: {}
          })
        });
        const res = await response.json();
        if (response.ok && res.ok) {
          log(`[API/POST] result-package 저장 성공! (결과 길이: ${resultText.length} 자)`);
        } else {
          log(`[API/POST] result-package 저장 실패: ${res.message || 'Error'}`);
        }
      } catch (err) {
        log(`[API/POST] 전송 에러: ${err.message}`);
      }
    }

    async function checkBackendJob() {
      if (isWorking) return;
      try {
        const response = await fetch('/api/test/trigger-status');
        const res = await response.json();
        console.log(`[MockGPT] Poll response: status=${res.status}, jobId=${res.data?.job_id}`);
        
        if (response.ok && res.ok && (res.status === 'pending' || (res.status === 'claimed' && res.data?.job_id && res.data.job_id !== lastMockedJobId))) {
          isWorking = true;
          setStatus('working');
          const trigger = res.data;
          currentJobId = trigger.job_id;
          currentProjectTitle = trigger.project_title;
          lastMockedJobId = currentJobId;
          
          log(`새 작업 감지! JobID: ${currentJobId}, 프로젝트명: ${currentProjectTitle}`);

          // 1. Acknowledge (Claim) - only if status is pending
          if (res.status === 'pending') {
            log(`[API/POST] trigger-ack 전송 중...`);
            await fetch('/api/test/trigger-ack', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                job_id: currentJobId,
                status: 'claimed',
                worker_id: 'firefox-worker'
              })
            });
          }

          // 2. Read latest prompt
          log(`[API/GET] latest-prompt 획득 중...`);
          const promptResponse = await fetch('/api/test/latest-prompt');
          const promptRes = await promptResponse.json();
          
          if (promptResponse.ok && promptRes.ok && promptRes.data && promptRes.data.prompt) {
            const promptText = promptRes.data.prompt;
            log(`latest-prompt 획득 성공 (${promptText.length} 자). 텍스트 입력창 주입 및 생성 실행.`);

            // 주입 및 실행
            textarea.value = promptText;
            textarea.dispatchEvent(new Event('input', { bubbles: true }));

            await new Promise(r => setTimeout(r, 1000));
            await handleSend();
          } else {
            log(`[오류] latest-prompt를 가져오지 못했습니다.`);
            isWorking = false;
            setStatus('polling');
          }
        }
      } catch (err) {
        log(`[오류] 폴링 중 에러: ${err.message}`);
      } finally {
        isWorking = false;
      }
    }

    function startPolling() {
      log("자동화 폴링 활성화됨.");
      setStatus('polling');
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(checkBackendJob, 3000);
      checkBackendJob();
    }

    function stopPolling() {
      log("자동화 폴링 중지됨.");
      setStatus('idle');
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    switchEl.addEventListener('change', function() {
      if (this.checked) {
        startPolling();
      } else {
        stopPolling();
      }
    });

    // URL 파라미터 automate=1 대응
    const params = new URLSearchParams(window.location.search);
    if (params.get('automate') === '1') {
      switchEl.checked = true;
      startPolling();
    }
  </script>
