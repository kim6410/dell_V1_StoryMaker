<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>StoryMaker 16종 썸네일</title>
<style>
:root{font-family:Inter,Pretendard,"Noto Sans KR",Arial,sans-serif;color:#eef6ff;background:#050a14}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 15% 0,#14294e 0,#07101e 35%,#040812 100%)}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:1780px;margin:0 auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 22px;border:1px solid #1f3a60;border-radius:20px;background:#081326}.eyebrow{margin:0 0 6px;color:#6feaff;font-size:11px;font-weight:900;letter-spacing:.16em}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:#91a8c8;font-size:13px}.save-all{border:0;border-radius:13px;padding:12px 18px;background:linear-gradient(135deg,#1bcce5,#3787ff);color:#fff;font-weight:900}.workspace{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}.panel{padding:16px;border:1px solid #1b3558;border-radius:18px;background:#081326;position:sticky;top:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel-head strong{font-size:18px}.panel-head span{color:#8096b6;font-size:11px}.upload{display:flex;min-height:82px;align-items:center;justify-content:center;flex-direction:column;border:1px dashed #3f6f9e;border-radius:14px;background:#0b1a31;color:#79edff;font-weight:900}.upload input{display:none}.upload small{margin-top:4px;color:#8398b7}.panel label{display:block;margin-top:11px;color:#c9d8ee;font-size:12px;font-weight:800}.panel input,.panel textarea{width:100%;margin-top:6px;padding:10px 11px;border:1px solid #263b5d;border-radius:10px;background:#0a172a;color:white;outline:none}.panel textarea{height:70px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{margin-top:12px;padding:10px 11px;border-radius:10px;background:#09111f;color:#8ba4c6;font-size:11px;line-height:1.45}.status:empty{display:none}.groups{display:grid;gap:14px}.group{padding:12px;border:1px solid #183151;border-radius:18px;background:rgba(7,14,28,.78)}.group-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}.group-head h2{margin:0;font-size:16px}.group-head span{color:#8297b7;font-size:11px}.grid-vertical{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.grid-horizontal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-width:0;padding:7px;border:1px solid #213a5d;border-radius:13px;background:#091426}.meta{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:6px}.meta strong{font-size:10px;white-space:nowrap}.meta button{border:1px solid #31557d;border-radius:7px;background:#0b1e37;color:#dffaff;padding:4px 6px;font-size:8px;font-weight:900}.preview{position:relative;width:100%;overflow:hidden;border-radius:9px;background:#101c2f}.vertical{aspect-ratio:9/16}.horizontal{aspect-ratio:16/9}.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.78))}.copy{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;justify-content:space-between}.tag{display:inline-flex;align-self:flex-start;padding:4px 7px;border-radius:999px;background:rgba(0,0,0,.56);border:1px solid rgba(255,255,255,.22);font-size:8px;font-weight:900}.copy h3{margin:auto 0 5px;font-size:clamp(12px,1.35vw,22px);line-height:1.08;letter-spacing:-.05em;text-shadow:0 3px 12px #000}.copy p{margin:0 0 8px;color:#dbe8f7;font-size:clamp(8px,.8vw,12px);font-weight:800}.brand{display:flex;justify-content:space-between;gap:6px;padding-top:7px;border-top:1px solid rgba(255,255,255,.2);font-size:8px;font-weight:900}.brand span:last-child{color:#ffe24c}.theme1{box-shadow:inset 6px 0 #58efff}.theme2 .tag{background:#ff315b}.theme3 .copy h3{color:#ffe24c}.theme4 .shade{background:linear-gradient(90deg,rgba(0,0,0,.9),rgba(0,0,0,.25))}.theme5{box-shadow:inset 0 6px #7c3cff}.theme6 .tag{background:#00a56a}.theme7 .copy h3{color:#77f3ff}.theme8 .tag{background:#ff8a00}.placeholder{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.18);font-size:16px;font-weight:900}.horizontal .copy{padding:9px 11px}.horizontal .copy h3{font-size:clamp(11px,1.1vw,18px)}.horizontal .copy p{font-size:8px}.horizontal .brand{font-size:7px}.preview-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;border-radius:9px;background:#101c2f}@media(max-width:1250px){body{min-width:1120px}.workspace{grid-template-columns:310px minmax(0,1fr)}.app{padding:12px}}body.embed-mode{background:#050a14}body.embed-mode .app{max-width:none;padding:10px}body.embed-mode .top{position:relative}body.embed-mode .workspace{margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><p class="eyebrow">STORYMAKER · BROWSER CANVAS</p><h1>16종 썸네일 자동 생성기</h1></div>
    <button class="save-all" id="saveAll">16종 모두 PNG 저장</button>
  </header>
  <div class="workspace">
    <aside class="panel">
      <div class="panel-head"><strong>입력</strong><span>간단 설정</span></div>
      <label class="upload"><input id="imageInput" type="file" accept="image/*"><span>배경 사진 선택</span><small>JPG · PNG · WEBP</small></label>
      <label>메인 제목<textarea id="title">곰팡이·결로, 원인은 따로 있습니다</textarea></label>
      <label>보조 문구<input id="subtitle" value="울산 현장 진단부터 시공까지"></label>
      <label>블로그 짧은 내용<textarea id="blogSummary">현장의 문제와 해결 과정을 한눈에 확인해 보세요.</textarea></label>
      <label>인스타그램 짧은 내용<textarea id="instagramSummary">반복되는 불편을 깔끔하게 해결했습니다.</textarea></label>
      <div class="row"><label>업체명<input id="business" value="오박사만능인테리어"></label><label>전화번호<input id="phone" value="010-8284-5584"></label></div>
      <label>강조 문구<input id="metric" value="하루 만에 해결"></label>
      <div class="status" id="status">최근 Beta 작업을 확인하는 중입니다.</div>
    </aside>
    <main class="groups">
      <section class="group"><div class="group-head"><h2>9:16 세로형 8종</h2><span>1080×1920 · 주력 템플릿</span></div><div class="grid-vertical" id="verticalGrid"></div></section>
      <section class="group"><div class="group-head"><h2>16:9 가로형 8종</h2><span>1280×720</span></div><div class="grid-horizontal" id="horizontalGrid"></div></section>
    </main>
  </div>
</div>
<script>
const templates=[
{id:'v1',name:'Neon Split',ratio:'vertical',w:1080,h:1920,theme:'theme1',tag:'현장 강조',style:'neonSplit'},
{id:'v2',name:'Badge Focus',ratio:'vertical',w:1080,h:1920,theme:'theme2',tag:'문제 해결',style:'badgeFocus'},
{id:'v3',name:'Metric Focus',ratio:'vertical',w:1080,h:1920,theme:'theme3',tag:'숫자 강조',style:'metricFocus'},
{id:'v4',name:'Story Focus',ratio:'vertical',w:1080,h:1920,theme:'theme4',tag:'스토리형',style:'storyFocus'},
{id:'v5',name:'Cyber Question',ratio:'vertical',w:1080,h:1920,theme:'theme7',tag:'왜 그럴까?',style:'cyberQuestion'},
{id:'v6',name:'Shock Alert',ratio:'vertical',w:1080,h:1920,theme:'theme2',tag:'긴급 경고',style:'shockAlert'},
{id:'v7',name:'Workflow Burst',ratio:'vertical',w:1080,h:1920,theme:'theme3',tag:'100% 자동화',style:'workflowBurst'},
{id:'v8',name:'Human Impact',ratio:'vertical',w:1080,h:1920,theme:'theme6',tag:'한 번에 해결',style:'humanImpact'},
{id:'h1',name:'Versus',ratio:'horizontal',w:1280,h:720,theme:'theme5',tag:'전후 비교',style:'versus'},
{id:'h2',name:'Wide Badge',ratio:'horizontal',w:1280,h:720,theme:'theme6',tag:'해결 강조',style:'wideBadge'},
{id:'h3',name:'Wide Neon',ratio:'horizontal',w:1280,h:720,theme:'theme7',tag:'현장 리포트',style:'wideNeon'},
{id:'h4',name:'Wide Metric',ratio:'horizontal',w:1280,h:720,theme:'theme8',tag:'효과 강조',style:'wideMetric'},
{id:'h5',name:'Dynamic Workflow',ratio:'horizontal',w:1280,h:720,theme:'theme3',tag:'DYNAMIC WORKFLOW',style:'dynamicWorkflow'},
{id:'h6',name:'Dev Time Cut',ratio:'horizontal',w:1280,h:720,theme:'theme6',tag:'시간 단축',style:'devTimeCut'},
{id:'h7',name:'AI Prompt Fix',ratio:'horizontal',w:1280,h:720,theme:'theme7',tag:'AI 해법',style:'aiPromptFix'},
{id:'h8',name:'Cloud Overpay',ratio:'horizontal',w:1280,h:720,theme:'theme2',tag:'결제 경고',style:'cloudOverpay'}
];
let imageUrl='';
let currentImage=null;
let currentJobId='';
let currentJobStatus='';
let userTouched=false;
let accountBusiness={name:'',phone:''};
let studioJobId='';
let studioSaveTimer=null;
let studioSaving=false;
let studioSaveAgain=false;
let studioRestoring=false;
const $=id=>document.getElementById(id);
function values(){return{title:$('title').value,subtitle:$('subtitle').value,blogSummary:$('blogSummary').value,instagramSummary:$('instagramSummary').value,business:$('business').value,phone:$('phone').value,metric:$('metric').value}}
function card(t,index){return `<article class="card"><div class="meta"><strong>${t.name}</strong><button data-save="${t.id}">PNG 저장</button></div><div class="preview ${t.ratio} ${t.theme}"><canvas id="canvas-${t.id}" class="preview-canvas" width="${t.w}" height="${t.h}" aria-label="${t.name} 썸네일 미리보기"></canvas></div></article>`}
function mount(){verticalGrid.innerHTML=templates.filter(t=>t.ratio==='vertical').map(card).join('');horizontalGrid.innerHTML=templates.filter(t=>t.ratio==='horizontal').map(card).join('');document.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>saveOne(templates.find(t=>t.id===b.dataset.save))));render()}
function render(){const v=values();templates.forEach(t=>drawTemplateToCanvas($(`canvas-${t.id}`),t,v))}
const FONT_STACK='Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif';
const STYLE_PRESETS={neonSplit:{accent:'#35f2ff',second:'#ffe600',title:'#fff',overlay:'left',effect:'neonBar'},badgeFocus:{accent:'#ff315b',second:'#ffe234',title:'#fff',overlay:'bottom',effect:'badgeGlow'},metricFocus:{accent:'#ffe234',second:'#35f2ff',title:'#ffe234',overlay:'bottom',effect:'metricRing'},storyFocus:{accent:'#fff',second:'#b8ff38',title:'#fff',overlay:'left',effect:'storyFrame'},cyberQuestion:{accent:'#26ecff',second:'#ffe234',title:'#fff',overlay:'center',effect:'questionHud'},shockAlert:{accent:'#ff3048',second:'#28eaff',title:'#fff',overlay:'center',effect:'alertPanel'},workflowBurst:{accent:'#ffe234',second:'#25e7a2',title:'#fff',overlay:'split',effect:'splitBeam'},humanImpact:{accent:'#b8ff38',second:'#fff',title:'#fff',overlay:'top',effect:'humanBurst'},versus:{accent:'#ffe234',second:'#ff4d76',title:'#fff',overlay:'split',effect:'versus'},wideBadge:{accent:'#27e690',second:'#ffe234',title:'#fff',overlay:'left',effect:'badgeGlow'},wideNeon:{accent:'#32efff',second:'#ffe234',title:'#fff',overlay:'left',effect:'wideHud'},wideMetric:{accent:'#ff9d31',second:'#ffe234',title:'#ffe234',overlay:'left',effect:'metricRing'},dynamicWorkflow:{accent:'#ffe234',second:'#24e9ff',title:'#fff',overlay:'split',effect:'splitBeam'},devTimeCut:{accent:'#b8ff38',second:'#ffe234',title:'#fff',overlay:'left',effect:'metricRing'},aiPromptFix:{accent:'#24e9ff',second:'#b8ff38',title:'#fff',overlay:'left',effect:'questionHud'},cloudOverpay:{accent:'#ff3048',second:'#24e9ff',title:'#fff',overlay:'left',effect:'alertPanel'}};
function wrapLines(ctx,text,maxWidth,maxLines=3){const words=String(text||'').trim().split(/\s+/).filter(Boolean),lines=[];let line='';for(const word of words){const next=line?`${line} ${word}`:word;if(ctx.measureText(next).width<=maxWidth){line=next;continue}if(line)lines.push(line);line=word;if(lines.length>=maxLines-1)break}if(line&&lines.length<maxLines)lines.push(line);return lines}
function fitFont(ctx,text,maxWidth,start,min,weight=900){let size=start;while(size>min){ctx.font=`${weight} ${size}px ${FONT_STACK}`;if(ctx.measureText(String(text||'')).width<=maxWidth)break;size-=2}return size}
function roundBox(ctx,x,y,w,h,r,fill,stroke='',line=0){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=line||2;ctx.strokeStyle=stroke;ctx.stroke()}}
function drawWrapped(ctx,text,x,y,maxWidth,size,lineHeight,color,maxLines=3,align='left',stroke='rgba(0,0,0,.94)'){ctx.font=`900 ${size}px ${FONT_STACK}`;ctx.textAlign=align;ctx.textBaseline='top';ctx.lineJoin='round';ctx.lineWidth=Math.max(6,size*.12);ctx.strokeStyle=stroke;ctx.fillStyle=color;const lines=wrapLines(ctx,text,maxWidth,maxLines);lines.forEach((line,i)=>{const yy=y+i*lineHeight;ctx.strokeText(line,x,yy,maxWidth);ctx.fillText(line,x,yy,maxWidth)});return lines.length}
function loadCurrentImage(src){return new Promise(resolve=>{if(!src){currentImage=null;resolve();return}const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{currentImage=img;resolve()};img.onerror=()=>{currentImage=null;resolve()};img.src=src})}
function drawCover(ctx,W,H,focusX=.5){if(!currentImage){ctx.fillStyle='#101c2f';ctx.fillRect(0,0,W,H);ctx.fillStyle='#61718a';ctx.font=`900 ${Math.round(W*.045)}px ${FONT_STACK}`;ctx.textAlign='center';ctx.fillText('배경 사진',W/2,H/2);return}const s=Math.max(W/currentImage.naturalWidth,H/currentImage.naturalHeight),w=currentImage.naturalWidth*s,h=currentImage.naturalHeight*s;let x=(W-w)*focusX;x=Math.min(0,Math.max(W-w,x));ctx.drawImage(currentImage,x,(H-h)/2,w,h)}
function drawOverlay(ctx,W,H,p){if(p.overlay==='split'){ctx.fillStyle='rgba(2,7,17,.74)';ctx.fillRect(0,0,W*.54,H);ctx.fillStyle='rgba(3,8,20,.18)';ctx.fillRect(W*.54,0,W*.46,H);return}const g=p.overlay==='left'?ctx.createLinearGradient(0,0,W,0):ctx.createLinearGradient(0,0,0,H);if(p.overlay==='left'){g.addColorStop(0,'rgba(0,0,0,.92)');g.addColorStop(.58,'rgba(0,0,0,.42)');g.addColorStop(1,'rgba(0,0,0,.08)')}else if(p.overlay==='top'){g.addColorStop(0,'rgba(0,0,0,.82)');g.addColorStop(.48,'rgba(0,0,0,.22)');g.addColorStop(1,'rgba(0,0,0,.78)')}else{g.addColorStop(0,'rgba(0,0,0,.16)');g.addColorStop(.48,'rgba(0,0,0,.42)');g.addColorStop(1,'rgba(0,0,0,.94)')}ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function drawEffects(ctx,W,H,t,p){ctx.save();if(p.effect==='neonBar'){ctx.shadowColor=p.accent;ctx.shadowBlur=34;ctx.fillStyle=p.accent;ctx.fillRect(28,0,18,H*.78);ctx.shadowBlur=0;ctx.globalAlpha=.3;ctx.fillRect(46,0,7,H*.78)}if(p.effect==='badgeGlow'){ctx.strokeStyle=p.accent;ctx.lineWidth=8;ctx.shadowColor=p.accent;ctx.shadowBlur=26;ctx.strokeRect(24,24,W-48,H-48);ctx.shadowBlur=0}if(p.effect==='metricRing'||p.effect==='questionHud'){const cx=W*(t.ratio==='vertical'?.68:.77),cy=H*(t.ratio==='vertical'?.25:.48),r=Math.min(W,H)*(t.ratio==='vertical'?.22:.29);ctx.strokeStyle=p.accent;ctx.lineWidth=10;ctx.globalAlpha=.72;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*1.58);ctx.stroke();ctx.lineWidth=3;ctx.globalAlpha=.46;ctx.beginPath();ctx.arc(cx,cy,r*.72,Math.PI*.3,Math.PI*1.9);ctx.stroke();ctx.globalAlpha=.2;ctx.fillStyle=p.accent;ctx.beginPath();ctx.arc(cx,cy,r*.48,0,Math.PI*2);ctx.fill();if(p.effect==='questionHud'){ctx.globalAlpha=.72;ctx.fillStyle=p.accent;ctx.font=`900 ${Math.round(r*1.15)}px ${FONT_STACK}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',cx,cy)}}if(p.effect==='alertPanel'){const x=W*.54,y=H*.07,w=W*.4,h=t.ratio==='vertical'?H*.2:H*.32;roundBox(ctx,x,y,w,h,18,'rgba(70,0,8,.74)',p.accent,5);ctx.fillStyle=p.accent;ctx.font=`900 ${Math.round(W*.034)}px ${FONT_STACK}`;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('ACCESS DENIED',x+w/2,y+h*.25);ctx.fillStyle='#fff';ctx.font=`800 ${Math.round(W*.016)}px ${FONT_STACK}`;ctx.fillText('WARNING · SYSTEM ALERT',x+w/2,y+h*.58)}if(p.effect==='splitBeam'){ctx.strokeStyle=p.accent;ctx.shadowColor=p.accent;ctx.shadowBlur=24;ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(W*.5,0);ctx.lineTo(W*.46,H*.34);ctx.lineTo(W*.54,H*.62);ctx.lineTo(W*.49,H);ctx.stroke();ctx.shadowBlur=0}if(p.effect==='versus'){ctx.fillStyle='rgba(90,54,180,.22)';ctx.fillRect(0,0,W/2,H);ctx.fillStyle='rgba(255,45,70,.17)';ctx.fillRect(W/2,0,W/2,H);ctx.fillStyle=p.accent;ctx.font=`900 ${Math.round(W*.11)}px ${FONT_STACK}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=16;ctx.strokeStyle='#000';ctx.strokeText('VS',W/2,H*.48);ctx.fillText('VS',W/2,H*.48)}if(p.effect==='wideHud'){ctx.strokeStyle=p.accent;ctx.globalAlpha=.62;ctx.lineWidth=4;for(let i=0;i<4;i++)ctx.strokeRect(30+i*10,30+i*10,W-60-i*20,H-60-i*20)}if(p.effect==='storyFrame'||p.effect==='humanBurst'){ctx.fillStyle=p.accent;ctx.globalAlpha=.18;ctx.beginPath();ctx.moveTo(0,H*.58);ctx.lineTo(W,H*.42);ctx.lineTo(W,H*.62);ctx.lineTo(0,H*.78);ctx.closePath();ctx.fill()}ctx.restore()}
function drawTag(ctx,t,p,vertical){const x=vertical?54:42,y=vertical?58:34,size=vertical?34:22;ctx.font=`900 ${size}px ${FONT_STACK}`;const w=ctx.measureText(t.tag).width+(vertical?42:30),h=vertical?62:42;ctx.shadowColor=p.accent;ctx.shadowBlur=18;roundBox(ctx,x,y,w,h,12,'rgba(5,12,24,.9)',p.accent,3);ctx.shadowBlur=0;ctx.fillStyle=p.accent;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(t.tag,x+(vertical?21:15),y+h/2)}
function drawBrandBar(ctx,W,H,v,p,vertical){const h=vertical?250:104,y=H-h,g=ctx.createLinearGradient(0,y,0,H);g.addColorStop(0,'rgba(0,8,20,.72)');g.addColorStop(1,'rgba(0,4,12,.98)');ctx.fillStyle=g;ctx.fillRect(0,y,W,h);ctx.fillStyle=p.accent;ctx.fillRect(0,y,vertical?18:10,h);const m=vertical?54:42;drawWrapped(ctx,v.business,m,y+(vertical?36:20),vertical?W-m*2:560,vertical?54:32,vertical?62:38,'#fff',1);drawWrapped(ctx,v.phone,vertical?m:W-m,y+(vertical?124:52),vertical?W-m*2:430,vertical?68:38,vertical?76:44,p.second,1,vertical?'left':'right')}
function drawTemplateToCanvas(c,t,v){if(!c)return;const ctx=c.getContext('2d'),W=c.width,H=c.height,vertical=t.ratio==='vertical',p=STYLE_PRESETS[t.style]||STYLE_PRESETS.neonSplit;ctx.clearRect(0,0,W,H);drawCover(ctx,W,H,vertical?.5:.68);drawOverlay(ctx,W,H,p);drawEffects(ctx,W,H,t,p);drawTag(ctx,t,p,vertical);let headline=v.title||'',sub=v.subtitle||'',summary=(['v1','v3','v5','v7','h1','h3','h5','h7'].includes(t.id)?v.blogSummary:v.instagramSummary)||sub;if(['metricFocus','wideMetric','devTimeCut','workflowBurst'].includes(t.style))headline=`${v.metric||'핵심 효과'} ${headline}`;if(['cyberQuestion','aiPromptFix'].includes(t.style)&&!/[?？]$/.test(headline))headline=`${headline}?`;const margin=vertical?54:46,maxW=vertical?W-margin*2:W*.64,titleY=vertical?H*.39:H*.27,titleSize=vertical?144:94,lineH=vertical?154:102;const size=fitFont(ctx,headline,maxW,titleSize,vertical?94:62);const lines=drawWrapped(ctx,headline,margin,titleY,maxW,size,Math.round(size*1.06),p.title,vertical?3:2);const subY=titleY+lines*Math.round(size*1.06)+(vertical?24:14);drawWrapped(ctx,sub,margin,subY,maxW,vertical?54:35,vertical?64:42,p.second,2);drawWrapped(ctx,summary,margin,subY+(vertical?142:84),maxW,vertical?38:26,vertical?48:32,'#f4f7fb',vertical?2:1);drawBrandBar(ctx,W,H,v,p,vertical)}
function safeFilePart(value,fallback='StoryMaker'){const cleaned=String(value||'').trim().replace(/[\\/:*?\"<>|]+/g,' ').replace(/\s+/g,'_').replace(/^_+|_+$/g,'');return cleaned||fallback}
function saveOne(t){const c=$(`canvas-${t.id}`);if(!c)return;c.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a'),business=safeFilePart($('business').value,'StoryMaker');a.href=url;a.download=`${business}_${t.id}_${t.w}x${t.h}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')}
function canvasBlob(canvas){return new Promise(resolve=>canvas?.toBlob(resolve,'image/png'))}
function studioPayload(includeRepresentative=false){const payload={...values(),job_id:studioJobId,version:'thumbnail-studio-16-v1'};if(includeRepresentative){const canvas=$('canvas-v1');if(canvas)payload.representative_data_url=canvas.toDataURL('image/png')}return payload}
async function restoreThumbnailStudio(jobId){if(!jobId)return false;try{const res=await fetch(`/beta-api/jobs/${encodeURIComponent(jobId)}/thumbnail-studio`,{credentials:'include',cache:'no-store'});if(!res.ok)return false;const data=await res.json().catch(()=>({})),saved=data.settings||{};if(!Object.keys(saved).length)return false;studioRestoring=true;for(const key of ['title','subtitle','blogSummary','instagramSummary','business','phone','metric'])if(saved[key]!=null&&$(key))$(key).value=String(saved[key]);userTouched=true;render();$('status').textContent=`저장된 16종 편집 내용 복원 · ${jobId}`;return true}catch(_){return false}finally{studioRestoring=false}}
async function uploadStudioCanvas(jobId,t){const canvas=$(`canvas-${t.id}`),blob=await canvasBlob(canvas);if(!blob)return false;const form=new FormData();form.append('file',blob,`${t.id}.png`);const res=await fetch(`/beta-api/jobs/${encodeURIComponent(jobId)}/thumbnail-studio/${encodeURIComponent(t.id)}`,{method:'POST',credentials:'include',body:form});if(!res.ok)throw new Error(`${t.id} 저장 실패`);return true}
async function saveThumbnailStudioNow(includeAll=true){if(!studioJobId||studioRestoring)return false;if(studioSaving){studioSaveAgain=true;return false}studioSaving=true;studioSaveAgain=false;try{$('status').textContent='16종 썸네일 자동 저장 중...';const settingsRes=await fetch(`/beta-api/jobs/${encodeURIComponent(studioJobId)}/thumbnail-studio/settings`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(studioPayload(false))});if(!settingsRes.ok)throw new Error('편집 설정 저장 실패');if(includeAll){for(const t of templates)await uploadStudioCanvas(studioJobId,t)}$('status').textContent='16종 썸네일 자동 저장 완료';return true}catch(error){$('status').textContent=`16종 자동 저장 실패: ${error.message}`;return false}finally{studioSaving=false;if(studioSaveAgain)scheduleThumbnailStudioSave()}}
function scheduleThumbnailStudioSave(){if(!studioJobId||studioRestoring)return;clearTimeout(studioSaveTimer);studioSaveTimer=setTimeout(()=>saveThumbnailStudioNow(true),1400)}
function flushThumbnailStudioOnLeave(){if(!studioJobId)return;clearTimeout(studioSaveTimer);try{const payload=JSON.stringify(studioPayload(true));navigator.sendBeacon(`/beta-api/jobs/${encodeURIComponent(studioJobId)}/thumbnail-studio/settings`,new Blob([payload],{type:'application/json'}))}catch(_){}}
function cleanText(value,limit=72){return String(value||'').replace(/[#*_`>|\[\]]/g,' ').replace(/\s+/g,' ').trim().slice(0,limit)}
function shortChannel(value,limit=78){const text=String(value||'').replace(/https?:\/\/\S+/g,' ').replace(/#[^\s#]+/g,' ').replace(/^\s*\d+[.)]\s*/gm,'').replace(/[#*_`>|\[\]]/g,' ').replace(/\s+/g,' ').trim();const parts=text.split(/(?<=[.!?。])\s+/).filter(Boolean);return cleanText(parts.slice(0,2).join(' ')||text,limit)}
function firstInstagramLine(value,limit=60){const raw=String(value||'').replace(/\r/g,'');const firstLine=raw.split('\n').map(line=>line.trim()).find(Boolean)||'';const cleaned=firstLine.replace(/https?:\/\/\S+/g,' ').replace(/#[^\s#]+/g,' ').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,' ').replace(/\s+/g,' ').trim();return cleanText(cleaned,limit)}
async function loadAccountBusiness(){for(const url of ['/v1-api/auth/personas','/api/auth/personas','/auth/personas']){try{const res=await fetch(url,{credentials:'include',cache:'no-store'});if(!res.ok)continue;const payload=await res.json().catch(()=>({}));const list=Array.isArray(payload?.data)?payload.data:Array.isArray(payload?.items)?payload.items:[];const persona=list.find(item=>item?.is_default)||list[0];if(!persona)continue;accountBusiness={name:cleanText(persona.company_name||persona.business_name||'',40),phone:cleanText(persona.phone_number||persona.phone||'',24)};if(accountBusiness.name)$('business').value=accountBusiness.name;if(accountBusiness.phone)$('phone').value=accountBusiness.phone;render();return true}catch(_){}}return false}
async function loadJob(jobId,force=false){if(!jobId||(!force&&jobId===currentJobId))return;const [jobRes,ctxRes]=await Promise.all([fetch(`/beta-api/jobs/${encodeURIComponent(jobId)}`,{credentials:'include',cache:'no-store'}),fetch(`/beta-api/shortform/jobs/${encodeURIComponent(jobId)}/context`,{credentials:'include',cache:'no-store'})]);if(!jobRes.ok||!ctxRes.ok)throw new Error('작업 상세 조회 실패');const jobPayload=await jobRes.json().catch(()=>({})),ctxPayload=await ctxRes.json().catch(()=>({})),job=jobPayload.job||jobPayload.data||{},ctx=ctxPayload.context||{};if(!Array.isArray(ctx.images)||!ctx.images.length)throw new Error('작업 이미지 없음');const content=job.content||{},channels=content.channels||{},blog=channels.BLOG||channels.blog||{},insta=channels.INSTAGRAM||channels.instagram||{};currentJobId=jobId;currentJobStatus=String(job.status||jobPayload.status||'');if(!userTouched||force){$('title').value=cleanText(ctx.title_line_2||content.title||job.title||'StoryMaker Beta',46);const instaSubtitle=firstInstagramLine(insta.content||content.instagram_summary||'',54);$('subtitle').value=cleanText(instaSubtitle||content.description||content.subtitle||shortChannel(blog.title||'',54)||'',54);$('blogSummary').value=shortChannel(blog.content||content.blog_summary||'',86)||'현장의 문제와 해결 과정을 확인해 보세요.';$('instagramSummary').value=shortChannel(insta.content||content.instagram_summary||'',76)||'작업 현장의 변화를 짧게 확인해 보세요.';$('metric').value=cleanText(content.highlight||content.metric||ctx.title_line_2||'현장 해결',22)}$('business').value=accountBusiness.name||ctx.business_name||job.business?.name||$('business').value||'';$('phone').value=accountBusiness.phone||ctx.business_phone||job.business?.phone||$('phone').value||'';imageUrl=ctx.images[Math.floor(ctx.images.length/2)];await loadCurrentImage(imageUrl);$('status').textContent=currentJobStatus&&!['completed','failed'].includes(currentJobStatus)?`현재 작업 자동 연결 · ${currentJobStatus}`:`최근 완성 작업 연결 · ${jobId}`;render()}
async function findLatestJob(){try{const res=await fetch('/beta-api/jobs',{credentials:'include',cache:'no-store'});if(!res.ok)throw new Error('작업 목록 조회 실패');const payload=await res.json().catch(()=>({})),items=Array.isArray(payload.items)?payload.items:[];const recent=items.slice(0,20),active=recent.find(item=>!['completed','failed'].includes(String(item.status||'').toLowerCase())&&Number(item.progress||0)<100),ordered=active?[active,...recent.filter(item=>item!==active)]:recent;for(const item of ordered){const jobId=String(item.beta_job_id||item.job_id||'');if(!jobId)continue;try{const ctxRes=await fetch(`/beta-api/shortform/jobs/${encodeURIComponent(jobId)}/context`,{credentials:'include',cache:'no-store'});if(!ctxRes.ok)continue;const ctxPayload=await ctxRes.json().catch(()=>({})),ctx=ctxPayload.context||{};if(!(ctx.images||[]).length)continue;const isActive=active&&jobId===String(active.beta_job_id||active.job_id||'');if(jobId===currentJobId&&!isActive)return;await loadJob(jobId,isActive);return}catch(_){}}$('status').textContent='이미지가 있는 현재 작업 또는 최근 작업을 찾지 못했습니다.'}catch(error){$('status').textContent=`작업 자동 연결 실패: ${error.message}`}}
$('imageInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;if(imageUrl&&imageUrl.startsWith('blob:'))URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(f);userTouched=true;await loadCurrentImage(imageUrl);$('status').textContent='';render();scheduleThumbnailStudioSave()});['title','subtitle','blogSummary','instagramSummary','business','phone','metric'].forEach(id=>$(id).addEventListener('input',()=>{userTouched=true;render();scheduleThumbnailStudioSave()}));$('saveAll').addEventListener('click',async()=>{for(const t of templates){await saveOne(t);await new Promise(r=>setTimeout(r,180))}$('status').textContent='16종 저장 요청 완료'});window.addEventListener('pagehide',flushThumbnailStudioOnLeave);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushThumbnailStudioOnLeave()});function reportFrameHeight(){if(window.parent===window)return;const height=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);window.parent.postMessage({type:'storymaker:thumbnail-frame-height',height},location.origin)}
async function applyCurrentPageData(data={}){const jobId=String(data.jobId||'').trim(),images=Array.isArray(data.images)?data.images.filter(Boolean):[];if(jobId)studioJobId=jobId;if(data.title2)$('title').value=cleanText(data.title2,46);const firstScriptLine=String(data.script||'').split(/\r?\n/).map(line=>line.trim()).find(Boolean)||'';if(firstScriptLine)$('subtitle').value=cleanText(firstScriptLine,54);if(data.script)$('blogSummary').value=shortChannel(data.script,86);if(data.business)$('business').value=cleanText(data.business,40);if(data.phone)$('phone').value=cleanText(data.phone,24);if(data.title2)$('metric').value=cleanText(data.title2,22);if(images.length){imageUrl=images[Math.floor(images.length/2)];await loadCurrentImage(imageUrl)}render();$('status').textContent=jobId?`현재 화면 데이터 연결 · ${jobId}`:'현재 화면 데이터 연결';if(jobId){try{await loadJob(jobId,true)}catch(_){}}reportFrameHeight()}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='storymaker:thumbnail-current-data')return;applyCurrentPageData(event.data.data||{}).catch(()=>{})});
async function boot(){const params=new URLSearchParams(location.search),embed=params.get('embed')==='1',requestedJobId=String(params.get('job_id')||'').trim();studioJobId=requestedJobId;if(embed)document.body.classList.add('embed-mode');mount();await loadAccountBusiness();if(window.parent!==window)window.parent.postMessage({type:'storymaker:thumbnail-ready'},location.origin);if(requestedJobId){try{await loadJob(requestedJobId,true);await restoreThumbnailStudio(requestedJobId)}catch(error){$('status').textContent=`현재 작업 연결 대기 · ${error.message}`}}else{await findLatestJob();studioJobId=currentJobId;await restoreThumbnailStudio(studioJobId)}reportFrameHeight();if(window.ResizeObserver)new ResizeObserver(reportFrameHeight).observe(document.body);setInterval(async()=>{if(!requestedJobId){await findLatestJob();studioJobId=currentJobId}reportFrameHeight()},6000)}boot();
</script>
