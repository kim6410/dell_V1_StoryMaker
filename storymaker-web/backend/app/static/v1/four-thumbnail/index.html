<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>StoryMaker 썸네일 생성기</title>
<style>
:root{font-family:Inter,Pretendard,"Noto Sans KR",Arial,sans-serif;color:#eef6ff;background:#050a14}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 15% 0,#14294e 0,#07101e 35%,#040812 100%)}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:1780px;margin:0 auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 22px;border:1px solid #1f3a60;border-radius:20px;background:#081326}.eyebrow{margin:0 0 6px;color:#6feaff;font-size:11px;font-weight:900;letter-spacing:.16em}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:#91a8c8;font-size:13px}.save-all{border:0;border-radius:13px;padding:12px 18px;background:linear-gradient(135deg,#1bcce5,#3787ff);color:#fff;font-weight:900}.workspace{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}.panel{padding:16px;border:1px solid #1b3558;border-radius:18px;background:#081326;position:sticky;top:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel-head strong{font-size:18px}.panel-head span{color:#8096b6;font-size:11px}.upload{display:flex;min-height:82px;align-items:center;justify-content:center;flex-direction:column;border:1px dashed #3f6f9e;border-radius:14px;background:#0b1a31;color:#79edff;font-weight:900}.upload input{display:none}.upload small{margin-top:4px;color:#8398b7}.panel label{display:block;margin-top:11px;color:#c9d8ee;font-size:12px;font-weight:800}.panel input,.panel textarea{width:100%;margin-top:6px;padding:10px 11px;border:1px solid #263b5d;border-radius:10px;background:#0a172a;color:white;outline:none}.panel textarea{height:70px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{margin-top:12px;padding:10px 11px;border-radius:10px;background:#09111f;color:#8ba4c6;font-size:11px;line-height:1.45}.status:empty{display:none}.groups{display:grid;gap:14px}.group{padding:12px;border:1px solid #183151;border-radius:18px;background:rgba(7,14,28,.78)}.group-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}.group-head h2{margin:0;font-size:16px}.group-head span{color:#8297b7;font-size:11px}.grid-vertical{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid-horizontal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-width:0;padding:7px;border:1px solid #213a5d;border-radius:13px;background:#091426;transition:border-color .2s,box-shadow .2s}.card.selected{border-color:#28e7a2;box-shadow:0 0 0 2px rgba(40,231,162,.22),0 0 24px rgba(40,231,162,.16)}.meta{display:grid;gap:8px;margin-bottom:8px}.meta strong{font-size:11px;white-space:nowrap}.meta button{width:100%;min-height:57px;border:1px solid #3b78ad;border-radius:14px;background:linear-gradient(135deg,#0d3158,#126ca1);color:#f2fbff;padding:13px 14px;font-size:16px;font-weight:900;box-shadow:0 10px 24px rgba(0,0,0,.26);cursor:pointer;transition:transform .16s,filter .16s,border-color .16s}.thumbnail-step-circle{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-right:6px;border-radius:50%;background:#1d73f2;color:#fff;font-size:11px;font-weight:900;box-shadow:0 0 0 3px rgba(29,115,242,.18)}.meta button:hover{filter:brightness(1.16);transform:translateY(-1px)}.meta button:disabled{cursor:wait;opacity:.72}.card.pending{border-color:#ffd54a;box-shadow:0 0 0 3px rgba(255,213,74,.28),0 0 28px rgba(255,213,74,.18)}.card.selected .meta button{border-color:#28e7a2;background:linear-gradient(135deg,#28e7a2,#79ffd2);color:#03120c;opacity:1;cursor:default}.preview{position:relative;width:85%;margin:0 auto;overflow:hidden;border-radius:9px;background:#101c2f;cursor:pointer;transition:transform .16s,filter .16s}.preview:hover{filter:brightness(1.06);transform:translateY(-2px)}.vertical{aspect-ratio:9/16}.horizontal{aspect-ratio:16/9}.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.78))}.copy{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;justify-content:space-between}.tag{display:inline-flex;align-self:flex-start;padding:4px 7px;border-radius:999px;background:rgba(0,0,0,.56);border:1px solid rgba(255,255,255,.22);font-size:8px;font-weight:900}.copy h3{margin:auto 0 5px;font-size:clamp(12px,1.35vw,22px);line-height:1.08;letter-spacing:-.05em;text-shadow:0 3px 12px #000}.copy p{margin:0 0 8px;color:#dbe8f7;font-size:clamp(8px,.8vw,12px);font-weight:800}.brand{display:flex;justify-content:space-between;gap:6px;padding-top:7px;border-top:1px solid rgba(255,255,255,.2);font-size:8px;font-weight:900}.brand span:last-child{color:#ffe24c}.theme1{box-shadow:inset 6px 0 #58efff}.theme2 .tag{background:#ff315b}.theme3 .copy h3{color:#ffe24c}.theme4 .shade{background:linear-gradient(90deg,rgba(0,0,0,.9),rgba(0,0,0,.25))}.theme5{box-shadow:inset 0 6px #7c3cff}.theme6 .tag{background:#00a56a}.theme7 .copy h3{color:#77f3ff}.theme8 .tag{background:#ff8a00}.placeholder{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.18);font-size:16px;font-weight:900}.horizontal .copy{padding:9px 11px}.horizontal .copy h3{font-size:clamp(11px,1.1vw,18px)}.horizontal .copy p{font-size:8px}.horizontal .brand{font-size:7px}.preview-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;border-radius:9px;background:#101c2f}@media(max-width:1250px){body{min-width:1008px}.workspace{grid-template-columns:300px minmax(0,1fr)}.app{padding:12px}}body.embed-mode{background:#050a14}body.embed-mode .app{max-width:none;padding:10px}body.embed-mode .top{position:relative}body.embed-mode .workspace{margin-top:12px}
.confirm-modal[hidden]{display:none}.confirm-modal{position:fixed;inset:0;z-index:9999;display:block;background:rgba(1,6,18,.28)}.confirm-box{position:fixed;top:var(--confirm-top,22px);left:var(--confirm-left,50%);transform:none;width:min(88vw,320px);border:1px solid #3a6f9f;border-radius:16px;background:linear-gradient(145deg,#0c1a30,#07101f);padding:16px;box-shadow:0 18px 46px rgba(0,0,0,.5),0 0 0 1px rgba(90,220,255,.08)}.confirm-box h3{margin:0;text-align:center;font-size:18px;color:#fff}.confirm-preview{display:none}.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.confirm-actions button{min-height:40px;border-radius:11px;font-size:14px;font-weight:900;cursor:pointer}.confirm-no{border:1px solid #52647d;background:#111c2e;color:#d8e3f2}.confirm-yes{border:0;background:linear-gradient(135deg,#28e7a2,#39b8ff);color:#03131b;box-shadow:0 8px 18px rgba(40,231,162,.2)}
.upload{position:relative;isolation:isolate;min-height:124px;text-align:center;overflow:hidden;background:#0b1a31 center/cover no-repeat}.upload::before{content:"";position:absolute;inset:0;z-index:-2;background-image:var(--selected-image,none);background-position:center;background-size:cover;filter:blur(2px);opacity:.28;transform:scale(1.08);transition:background-image .25s ease,opacity .25s ease}.upload::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,rgba(5,15,31,.78),rgba(8,28,51,.62));transition:background .2s}.upload:hover::before{opacity:.4}.upload-content{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;border-radius:12px;background:rgba(4,12,25,.34);backdrop-filter:blur(2px)}.upload-icon{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;flex:0 0 42px;border:1px solid rgba(121,237,255,.55);border-radius:13px;background:rgba(8,30,54,.72);color:#79edff;box-shadow:0 0 18px rgba(53,233,255,.16)}.upload-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.upload-label{font-size:22px;line-height:1.35}.upload-hint{display:block;margin-top:3px;color:#b8d4e8;font-size:11px;font-weight:700}.panel label.field-gap{margin-top:19px}.panel #title{font-size:15px}.panel #subtitle{font-size:14px}.source-only{display:none!important}.image-picker-modal[hidden]{display:none}.image-picker-modal{position:fixed;inset:0;z-index:10020;display:grid;place-items:start center;padding:12px 22px 22px;background:rgba(1,6,18,.82);backdrop-filter:blur(8px);overflow:auto}.image-picker-box{width:min(94vw,960px);max-height:calc(100vh - 24px);overflow:auto;border:1px solid #356999;border-radius:22px;background:#071326;padding:20px;box-shadow:0 28px 90px rgba(0,0,0,.6)}.image-picker-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.image-picker-head h3{margin:0;font-size:22px}.image-picker-close{border:1px solid #4c6280;background:#111d30;color:#dce8f8;border-radius:12px;padding:9px 14px;font-weight:900}.image-picker-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.image-picker-item{border:2px solid transparent;border-radius:14px;padding:5px;background:#0b1b31}.image-picker-item.active{border-color:#35e9ff;box-shadow:0 0 0 3px rgba(53,233,255,.16)}.image-picker-item img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:9px}.image-picker-item span{display:block;padding:8px 3px 3px;color:#c9d8ee;font-size:12px;font-weight:900;text-align:center}@media(max-width:760px){.image-picker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><p class="eyebrow">STORYMAKER · BROWSER CANVAS</p><h1>썸네일 생성기</h1></div>
  </header>
  <div class="workspace">
    <aside class="panel">
      <div class="panel-head"><strong>입력</strong><span>간단 설정</span></div>
      <button type="button" class="upload" id="imagePickerOpen" aria-label="썸네일 배경 이미지 선택"><span class="upload-content"><span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h3l1.4-2h7.2L17 5h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"></path><circle cx="12" cy="12" r="4"></circle><path d="M18 8h.01"></path></svg></span><span><span class="upload-label">이미지 선택</span><small class="upload-hint">현재 이미지 변경</small></span></span></button>
      <input id="imageInput" type="file" accept="image/*" hidden>
      <label>메인타이틀<textarea id="title">곰팡이·결로, 원인은 따로 있습니다</textarea></label>
      <label class="field-gap">서브 타이틀<input id="subtitle" value="울산 현장 진단부터 시공까지"></label>
      <label class="field-gap">내용<textarea id="blogSummary">현장의 문제와 해결 과정을 한눈에 확인해 보세요.</textarea></label>
      <label class="source-only">인스타그램 원문<textarea id="instagramSummary">반복되는 불편을 깔끔하게 해결했습니다.</textarea></label>
      <div class="row"><label>업체명<input id="business" value="오박사만능인테리어"></label><label>전화번호<input id="phone" value="010-8284-5584"></label></div>
      <label>강조 문구<input id="metric" value="하루 만에 해결"></label>
      <div class="status" id="status">최근 Beta 작업을 확인하는 중입니다.</div>
    </aside>
    <main class="groups">
      <section class="group"><div class="group-head"><h2>9:16 세로형 8종</h2><span>1080×1920 · 주력 템플릿</span></div><div class="grid-vertical" id="verticalGrid"></div></section>
      <!-- 16:9 가로형 8종은 저장공간 절약 정책에 따라 사용자 화면에서 비활성화했습니다. -->
    </main>
  </div>
</div>
<div class="confirm-modal" id="thumbnailConfirm" hidden>
  <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="thumbnailConfirmTitle">
    <h3 id="thumbnailConfirmTitle">저장하시겠습니까?</h3>
    <div class="confirm-actions">
      <button type="button" class="confirm-no" id="thumbnailConfirmNo">아니오</button>
      <button type="button" class="confirm-yes" id="thumbnailConfirmYes">예</button>
    </div>
  </div>
</div>
<div class="image-picker-modal" id="imagePickerModal" hidden>
  <div class="image-picker-box" role="dialog" aria-modal="true" aria-labelledby="imagePickerTitle">
    <div class="image-picker-head"><h3 id="imagePickerTitle">배경 이미지 선택</h3><button type="button" class="image-picker-close" id="imagePickerClose">닫기</button></div>
    <div class="image-picker-grid" id="imagePickerGrid"></div>
  </div>
</div>
<script>
const templates=[
{id:'v1',name:'Neon Split',ratio:'vertical',w:1080,h:1920,theme:'theme1',tag:'현장 강조',style:'neonSplit'},
{id:'v2',name:'Badge Focus',ratio:'vertical',w:1080,h:1920,theme:'theme2',tag:'문제 해결',style:'badgeFocus'},
{id:'v3',name:'Metric Focus',ratio:'vertical',w:1080,h:1920,theme:'theme3',tag:'숫자 강조',style:'metricFocus'},
{id:'v4',name:'Story Focus',ratio:'vertical',w:1080,h:1920,theme:'theme4',tag:'스토리형',style:'storyFocus'},
{id:'v5',name:'Cyber Question',ratio:'vertical',w:1080,h:1920,theme:'theme7',tag:'왜 그럴까?',style:'cyberQuestion'},
{id:'v6',name:'Shock Alert',ratio:'vertical',w:1080,h:1920,theme:'theme2',tag:'긴급 경고',style:'shockAlert'},
{id:'v7',name:'Workflow Burst',ratio:'vertical',w:1080,h:1920,theme:'theme3',tag:'100% 자동화',style:'workflowBurst'},
{id:'v8',name:'Human Impact',ratio:'vertical',w:1080,h:1920,theme:'theme6',tag:'한 번에 해결',style:'humanImpact'},
{id:'h1',name:'Versus',ratio:'horizontal',w:1280,h:720,theme:'theme5',tag:'전후 비교',style:'versus'},
{id:'h2',name:'Wide Badge',ratio:'horizontal',w:1280,h:720,theme:'theme6',tag:'해결 강조',style:'wideBadge'},
{id:'h3',name:'Wide Neon',ratio:'horizontal',w:1280,h:720,theme:'theme7',tag:'현장 리포트',style:'wideNeon'},
{id:'h4',name:'Wide Metric',ratio:'horizontal',w:1280,h:720,theme:'theme8',tag:'효과 강조',style:'wideMetric'},
{id:'h5',name:'Dynamic Workflow',ratio:'horizontal',w:1280,h:720,theme:'theme3',tag:'DYNAMIC WORKFLOW',style:'dynamicWorkflow'},
{id:'h6',name:'Dev Time Cut',ratio:'horizontal',w:1280,h:720,theme:'theme6',tag:'시간 단축',style:'devTimeCut'},
{id:'h7',name:'AI Prompt Fix',ratio:'horizontal',w:1280,h:720,theme:'theme7',tag:'AI 해법',style:'aiPromptFix'},
{id:'h8',name:'Cloud Overpay',ratio:'horizontal',w:1280,h:720,theme:'theme2',tag:'결제 경고',style:'cloudOverpay'}
];
let imageUrl='';
let currentImage=null;
let jobImages=[];
let currentJobId='';
let currentJobStatus='';
let userTouched=false;
let accountBusiness={name:'',phone:''};
let studioJobId='';
let studioSaving=false;
let pendingTemplate=null;
let studioRestoring=false;
let studioDirty=false;
const autoDefaultSaveJobs=new Set();
let renderFrame=0;
const exportCanvas=document.createElement('canvas');
const $=id=>document.getElementById(id);
async function authFetch(url,options={}){const requestOptions={credentials:'include',cache:'no-store',...options};return fetch(url,requestOptions)}
async function saveThumbnailViaParent(jobId,t,blob){if(window.parent===window)return null;const requestId=`thumb_${Date.now()}_${Math.random().toString(16).slice(2)}`;const pngBuffer=await blob.arrayBuffer();return await new Promise((resolve,reject)=>{const timer=setTimeout(()=>{window.removeEventListener('message',onMessage);reject(new Error('상위 화면 저장 응답 시간 초과'))},45000);function onMessage(event){const data=event.data||{};if(data.type!=='storymaker:thumbnail-save-response'||data.requestId!==requestId)return;clearTimeout(timer);window.removeEventListener('message',onMessage);if(!data.ok)reject(new Error(data.error||'대표 썸네일 저장 실패'));else resolve(data)}window.addEventListener('message',onMessage);window.parent.postMessage({type:'storymaker:thumbnail-save-request',requestId,jobId,templateId:t.id,pngBuffer,settings:studioPayload()},'*',[pngBuffer])})}
function values(){return{title:$('title').value,subtitle:$('subtitle').value,blogSummary:$('blogSummary').value,instagramSummary:$('instagramSummary').value,business:$('business').value,phone:$('phone').value,metric:$('metric').value,jobId:String(studioJobId||currentJobId||'')}}
function instagramHashtags(value){const found=String(value||'').match(/#[^\s#]+/g)||[];return [...new Set(found.map(tag=>tag.replace(/^#+/,'').replace(/[.,!?;:~]+$/,'').trim()).filter(Boolean))]}
function stableHash(value){let h=2166136261;for(const ch of String(value||'')){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function badgeTags(v){const tags=instagramHashtags(v.instagramSummary);if(!tags.length)return activeTemplates.map(t=>t.tag);const pool=[...tags],seed=stableHash(v.jobId||v.title||v.instagramSummary);for(let i=pool.length-1;i>0;i--){const j=stableHash(`${seed}:${i}`)%(i+1);[pool[i],pool[j]]=[pool[j],pool[i]]}return activeTemplates.map((t,index)=>pool[index%pool.length]||t.tag)}
function previewSize(t){return t.ratio==='vertical'?{w:270,h:480}:{w:320,h:180}}
const activeTemplates=templates.filter(t=>t.ratio==='vertical');
function card(t,index){const size=previewSize(t);return `<article class="card" data-template-card="${t.id}"><div class="meta"><strong>${t.name}</strong><button type="button" data-select="${t.id}">선택</button></div><div class="preview ${t.ratio} ${t.theme}"><canvas id="canvas-${t.id}" class="preview-canvas" width="${size.w}" height="${size.h}" aria-label="${t.name} 썸네일 미리보기"></canvas></div></article>`}
function markPending(templateId){document.querySelectorAll('[data-template-card]').forEach(card=>card.classList.toggle('pending',card.dataset.templateCard===templateId))}
function markSelected(templateId){document.querySelectorAll('[data-template-card]').forEach(card=>{card.classList.remove('pending');card.classList.toggle('selected',card.dataset.templateCard===templateId)});document.querySelectorAll('[data-select]').forEach(button=>{const selected=button.dataset.select===templateId;button.textContent=selected?'저장 완료':'선택';button.disabled=selected})}
function openThumbnailConfirm(t,anchor){if(!t||studioSaving)return;pendingTemplate=t;markPending(t.id);const modal=$('thumbnailConfirm'),box=modal.querySelector('.confirm-box'),rect=anchor?.getBoundingClientRect?.();modal.hidden=false;if(rect&&box){const width=Math.min(320,window.innerWidth*.88),height=box.offsetHeight||126,gap=12;let left=rect.right+gap;if(left+width>window.innerWidth-12)left=rect.left-width-gap;if(left<12)left=Math.max(12,Math.min(window.innerWidth-width-12,rect.left));let top=Math.max(12,Math.min(window.innerHeight-height-12,rect.top+(rect.height-height)/2));box.style.setProperty('--confirm-left',`${Math.round(left)}px`);box.style.setProperty('--confirm-top',`${Math.round(top)}px`)}$('status').textContent=`${t.name} 선택됨 · 저장 확인 대기`}
function closeThumbnailConfirm(cancelled=false){$('thumbnailConfirm').hidden=true;if(cancelled){pendingTemplate=null;markPending('');$('status').textContent='저장이 취소되었습니다.'}}
function mount(){verticalGrid.innerHTML=activeTemplates.map(card).join('');verticalGrid.addEventListener('click',event=>{const cardEl=event.target.closest('[data-template-card]');if(!cardEl)return;const trigger=event.target.closest('[data-select],.preview');if(!trigger)return;openThumbnailConfirm(activeTemplates.find(t=>t.id===cardEl.dataset.templateCard),trigger)});$('thumbnailConfirmNo').addEventListener('click',()=>closeThumbnailConfirm(true));$('thumbnailConfirmYes').addEventListener('click',()=>{const t=pendingTemplate;closeThumbnailConfirm(false);selectThumbnail(t)});render()}
function renderNow(){const v=values(),tags=badgeTags(v);activeTemplates.forEach((t,index)=>drawTemplateToCanvas($(`canvas-${t.id}`),t,{...v,badgeTag:tags[index]}))}
function render(){if(renderFrame)cancelAnimationFrame(renderFrame);renderFrame=requestAnimationFrame(()=>{renderFrame=0;renderNow()})}

function carouselBlocks(value){const lines=String(value||'').replace(/\r/g,'').split('\n'),blocks=[];let current=null;for(const raw of lines){const line=String(raw||'').trim();const heading=line.match(/^#{1,6}\s+(.+)$/);if(heading){if(current)blocks.push(current);current={title:removeLeadingNumber(cleanText(heading[1],70)),body:[]};continue}if(/^---+$/.test(line)){if(current){blocks.push(current);current=null}continue}if(current&&line)current.body.push(line)}if(current)blocks.push(current);return blocks.map(block=>({title:block.title,body:cleanText(block.body.join(' '),110)})).filter(block=>block.title||block.body)}
async function loadAccountBusiness(){for(const url of ['/v1-api/auth/personas','/api/auth/personas','/auth/personas']){try{const res=await fetch(url,{credentials:'include',cache:'no-store'});if(!res.ok)continue;const payload=await res.json().catch(()=>({}));const list=Array.isArray(payload?.data)?payload.data:Array.isArray(payload?.items)?payload.items:[];const persona=list.find(item=>item?.is_default)||list[0];if(!persona)continue;accountBusiness={name:cleanText(persona.company_name||persona.business_name||'',40),phone:cleanText(persona.phone_number||persona.phone||'',24)};if(accountBusiness.name)$('business').value=accountBusiness.name;if(accountBusiness.phone)$('phone').value=accountBusiness.phone;render();return true}catch(_){}}return false}
async function loadJob(jobId,force=false){if(!jobId||(!force&&jobId===currentJobId))return;const [jobRes,ctxRes]=await Promise.all([fetch(`/beta-api/jobs/${encodeURIComponent(jobId)}`,{credentials:'include',cache:'no-store'}),fetch(`/beta-api/shortform/jobs/${encodeURIComponent(jobId)}/context`,{credentials:'include',cache:'no-store'})]);if(!jobRes.ok||!ctxRes.ok)throw new Error('작업 상세 조회 실패');const jobPayload=await jobRes.json().catch(()=>({})),ctxPayload=await ctxRes.json().catch(()=>({})),job=jobPayload.job||jobPayload.data||{},ctx=ctxPayload.context||{};if(!Array.isArray(ctx.images)||!ctx.images.length)throw new Error('작업 이미지 없음');const content=job.content||{},channels=content.channels||{},blog=channels.BLOG||channels.blog||{},carousel=channels.CAROUSEL_7||channels.carousel_7||{},carouselText=carousel.content||carousel||'',carouselItems=carouselBlocks(carouselText),carouselFirst=carouselItems[0]||{},carouselSecond=carouselItems[1]||{},insta=channels.INSTAGRAM||channels.instagram||{},instaText=insta.content||content.instagram_summary||'',instaRows=instagramLines(instaText);currentJobId=jobId;currentJobStatus=String(job.status||jobPayload.status||'');if(!userTouched||force){$('title').value=removeLeadingNumber(cleanText(carouselFirst.title||ctx.title_line_1||content.title||job.title||'StoryMaker Beta',52));$('subtitle').value=cleanText(carouselSecond.title||ctx.title_line_2||instaRows[0]||content.description||content.subtitle||shortChannel(blog.title||'',70)||'',70);$('blogSummary').value=cleanText(carouselSecond.body||instaRows[1]||instaRows.slice(1).join(' ')||shortChannel(blog.content||content.blog_summary||'',110)||'현장의 문제와 해결 과정을 확인해 보세요.',110);$('instagramSummary').value=String(instaText||'').trim();$('metric').value=removeLeadingNumber(cleanText(content.highlight||content.metric||'현장 해결',22))}$('business').value=accountBusiness.name||ctx.business_name||job.business?.name||$('business').value||'';$('phone').value=accountBusiness.phone||ctx.business_phone||job.business?.phone||$('phone').value||'';jobImages=ctx.images.filter(Boolean);imageUrl=jobImages[Math.floor(jobImages.length/2)];await loadCurrentImage(imageUrl);$('status').textContent=currentJobStatus&&!['completed','failed'].includes(currentJobStatus)?`현재 작업 자동 연결 · ${currentJobStatus}`:`최근 완성 작업 연결 · ${jobId}`;render()}
async function findLatestJob(){try{const res=await fetch('/beta-api/jobs',{credentials:'include',cache:'no-store'});if(!res.ok)throw new Error('작업 목록 조회 실패');const payload=await res.json().catch(()=>({})),items=Array.isArray(payload.items)?payload.items:[];const recent=items.slice(0,20),active=recent.find(item=>!['completed','failed'].includes(String(item.status||'').toLowerCase())&&Number(item.progress||0)<100),ordered=active?[active,...recent.filter(item=>item!==active)]:recent;for(const item of ordered){const jobId=String(item.beta_job_id||item.job_id||'');if(!jobId)continue;try{const ctxRes=await fetch(`/beta-api/shortform/jobs/${encodeURIComponent(jobId)}/context`,{credentials:'include',cache:'no-store'});if(!ctxRes.ok)continue;const ctxPayload=await ctxRes.json().catch(()=>({})),ctx=ctxPayload.context||{};if(!(ctx.images||[]).length)continue;const isActive=active&&jobId===String(active.beta_job_id||active.job_id||'');if(jobId===currentJobId&&!isActive)return;await loadJob(jobId,isActive);return}catch(_){}}$('status').textContent='이미지가 있는 현재 작업 또는 최근 작업을 찾지 못했습니다.'}catch(error){$('status').textContent=`작업 자동 연결 실패: ${error.message}`}}
$('imagePickerOpen').addEventListener('click',openImagePicker);$('imagePickerClose').addEventListener('click',closeImagePicker);$('imagePickerModal').addEventListener('click',event=>{if(event.target===$('imagePickerModal'))closeImagePicker()});$('imagePickerGrid').addEventListener('click',event=>{const button=event.target.closest('[data-image-index]');if(button)chooseJobImage(Number(button.dataset.imageIndex))});['title','subtitle','blogSummary','instagramSummary','business','phone','metric'].forEach(id=>$(id).addEventListener('input',()=>{userTouched=true;studioDirty=true;$('status').textContent='편집 내용이 변경되었습니다. 저장 버튼을 누르면 최종 PNG가 생성됩니다.';render()}));window.addEventListener('pagehide',flushSettingsOnLeave);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSettingsOnLeave()});function reportFrameHeight(){if(window.parent===window)return;const height=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);window.parent.postMessage({type:'storymaker:thumbnail-frame-height',height},location.origin)}
async function saveStoryFocusDefault(jobId){const safeJobId=String(jobId||'').trim();if(!safeJobId||autoDefaultSaveJobs.has(safeJobId))return;autoDefaultSaveJobs.add(safeJobId);try{const stateRes=await authFetch(`/beta-api/jobs/${encodeURIComponent(safeJobId)}/thumbnail-studio?t=${Date.now()}`),state=await stateRes.json().catch(()=>({}));if(stateRes.ok&&state.selected_template_id&&state.files?.[state.selected_template_id]){markSelected(String(state.selected_template_id));$('status').textContent=`기존 대표 썸네일 유지 · ${state.selected_template_id}`;return}const storyFocus=activeTemplates.find(item=>item.id==='v4');if(!storyFocus)throw new Error('Story Focus 템플릿을 찾지 못했습니다.');$('status').textContent='Story Focus 기본 썸네일 자동 저장 중...';await selectThumbnail(storyFocus);const verifyRes=await authFetch(`/beta-api/jobs/${encodeURIComponent(safeJobId)}/thumbnail-studio?t=${Date.now()}`),verify=await verifyRes.json().catch(()=>({}));if(!verifyRes.ok||String(verify.selected_template_id||'')!=='v4'||!verify.files?.v4)throw new Error('Story Focus 자동 저장 검증 실패');$('status').textContent='Story Focus 기본 썸네일 자동 저장 완료 · 사용자가 다른 템플릿을 선택하면 교체됩니다.'}catch(error){autoDefaultSaveJobs.delete(safeJobId);$('status').textContent=`기본 썸네일 자동 저장 실패: ${error.message}`}}
async function applyCurrentPageData(data={}){const jobId=String(data.jobId||'').trim(),images=Array.isArray(data.images)?data.images.filter(Boolean):[],carouselItems=carouselBlocks(data.carouselContent||''),carouselFirst=carouselItems[0]||{},carouselSecond=carouselItems[1]||{};if(jobId)studioJobId=jobId;if(carouselFirst.title)$('title').value=removeLeadingNumber(cleanText(carouselFirst.title,52));else if(data.title1)$('title').value=removeLeadingNumber(cleanText(data.title1,52));if(carouselSecond.title)$('subtitle').value=cleanText(carouselSecond.title,70);else if(data.title2)$('subtitle').value=cleanText(data.title2,70);if(carouselSecond.body)$('blogSummary').value=cleanText(carouselSecond.body,110);if(data.instagramContent)$('instagramSummary').value=String(data.instagramContent||'').trim();if(data.business)$('business').value=cleanText(data.business,40);if(data.phone)$('phone').value=cleanText(data.phone,24);if(carouselSecond.title)$('metric').value=removeLeadingNumber(cleanText(carouselSecond.title,22));else if(data.title2)$('metric').value=removeLeadingNumber(cleanText(data.title2,22));if(images.length){jobImages=images;imageUrl=jobImages[Math.floor(jobImages.length/2)];await loadCurrentImage(imageUrl)}render();$('status').textContent=jobId?`현재 카드뉴스 문구 연결 · ${jobId}`:'현재 화면 데이터 연결';if(jobId){try{await loadJob(jobId,true);await restoreThumbnailStudio(jobId)}catch(_){$('status').textContent=`카드뉴스 직접 연결 완료 · ${jobId}`}if(data.autoSaveDefault)await saveStoryFocusDefault(jobId)}reportFrameHeight()}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='storymaker:thumbnail-current-data')return;applyCurrentPageData(event.data.data||{}).catch(()=>{})});
async function boot(){const params=new URLSearchParams(location.search),embed=params.get('embed')==='1',requestedJobId=String(params.get('job_id')||'').trim();studioJobId=requestedJobId;if(embed)document.body.classList.add('embed-mode');mount();await loadAccountBusiness();if(window.parent!==window)window.parent.postMessage({type:'storymaker:thumbnail-ready'},location.origin);if(requestedJobId){try{await loadJob(requestedJobId,true);await restoreThumbnailStudio(requestedJobId)}catch(error){$('status').textContent=`현재 작업 연결 대기 · ${error.message}`}}else{await findLatestJob();studioJobId=currentJobId;await restoreThumbnailStudio(studioJobId)}reportFrameHeight();if(window.ResizeObserver)new ResizeObserver(reportFrameHeight).observe(document.body);setInterval(async()=>{if(!requestedJobId)await findLatestJob();reportFrameHeight()},6000)}boot();
</script>
