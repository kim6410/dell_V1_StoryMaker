<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>StoryMaker 8종 썸네일</title>
<style>
:root{font-family:Inter,Pretendard,"Noto Sans KR",Arial,sans-serif;color:#eef6ff;background:#050a14}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 15% 0,#14294e 0,#07101e 35%,#040812 100%)}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:1780px;margin:0 auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 22px;border:1px solid #1f3a60;border-radius:20px;background:#081326}.eyebrow{margin:0 0 6px;color:#6feaff;font-size:11px;font-weight:900;letter-spacing:.16em}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:#91a8c8;font-size:13px}.save-all{border:0;border-radius:13px;padding:12px 18px;background:linear-gradient(135deg,#1bcce5,#3787ff);color:#fff;font-weight:900}.workspace{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}.panel{padding:16px;border:1px solid #1b3558;border-radius:18px;background:#081326;position:sticky;top:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel-head strong{font-size:18px}.panel-head span{color:#8096b6;font-size:11px}.upload{display:flex;min-height:82px;align-items:center;justify-content:center;flex-direction:column;border:1px dashed #3f6f9e;border-radius:14px;background:#0b1a31;color:#79edff;font-weight:900}.upload input{display:none}.upload small{margin-top:4px;color:#8398b7}.panel label{display:block;margin-top:11px;color:#c9d8ee;font-size:12px;font-weight:800}.panel input,.panel textarea{width:100%;margin-top:6px;padding:10px 11px;border:1px solid #263b5d;border-radius:10px;background:#0a172a;color:white;outline:none}.panel textarea{height:70px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{margin-top:12px;padding:10px 11px;border-radius:10px;background:#09111f;color:#8ba4c6;font-size:11px;line-height:1.45}.status:empty{display:none}.groups{display:grid;gap:14px}.group{padding:12px;border:1px solid #183151;border-radius:18px;background:rgba(7,14,28,.78)}.group-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}.group-head h2{margin:0;font-size:16px}.group-head span{color:#8297b7;font-size:11px}.grid-vertical{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.grid-horizontal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-width:0;padding:7px;border:1px solid #213a5d;border-radius:13px;background:#091426}.meta{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:6px}.meta strong{font-size:10px;white-space:nowrap}.meta button{border:1px solid #31557d;border-radius:7px;background:#0b1e37;color:#dffaff;padding:4px 6px;font-size:8px;font-weight:900}.preview{position:relative;width:100%;overflow:hidden;border-radius:9px;background:#101c2f}.vertical{aspect-ratio:9/16}.horizontal{aspect-ratio:16/9}.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.78))}.copy{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;justify-content:space-between}.tag{display:inline-flex;align-self:flex-start;padding:4px 7px;border-radius:999px;background:rgba(0,0,0,.56);border:1px solid rgba(255,255,255,.22);font-size:8px;font-weight:900}.copy h3{margin:auto 0 5px;font-size:clamp(12px,1.35vw,22px);line-height:1.08;letter-spacing:-.05em;text-shadow:0 3px 12px #000}.copy p{margin:0 0 8px;color:#dbe8f7;font-size:clamp(8px,.8vw,12px);font-weight:800}.brand{display:flex;justify-content:space-between;gap:6px;padding-top:7px;border-top:1px solid rgba(255,255,255,.2);font-size:8px;font-weight:900}.brand span:last-child{color:#ffe24c}.theme1{box-shadow:inset 6px 0 #58efff}.theme2 .tag{background:#ff315b}.theme3 .copy h3{color:#ffe24c}.theme4 .shade{background:linear-gradient(90deg,rgba(0,0,0,.9),rgba(0,0,0,.25))}.theme5{box-shadow:inset 0 6px #7c3cff}.theme6 .tag{background:#00a56a}.theme7 .copy h3{color:#77f3ff}.theme8 .tag{background:#ff8a00}.placeholder{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.18);font-size:16px;font-weight:900}.horizontal .copy{padding:9px 11px}.horizontal .copy h3{font-size:clamp(11px,1.1vw,18px)}.horizontal .copy p{font-size:8px}.horizontal .brand{font-size:7px}.preview-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;border-radius:9px;background:#101c2f}@media(max-width:1250px){body{min-width:1120px}.workspace{grid-template-columns:310px minmax(0,1fr)}.app{padding:12px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><p class="eyebrow">STORYMAKER · BROWSER CANVAS</p><h1>8종 썸네일 자동 생성기</h1></div>
    <button class="save-all" id="saveAll">8종 모두 PNG 저장</button>
  </header>
  <div class="workspace">
    <aside class="panel">
      <div class="panel-head"><strong>입력</strong><span>간단 설정</span></div>
      <label class="upload"><input id="imageInput" type="file" accept="image/*"><span>배경 사진 선택</span><small>JPG · PNG · WEBP</small></label>
      <label>메인 제목<textarea id="title">곰팡이·결로, 원인은 따로 있습니다</textarea></label>
      <label>보조 문구<input id="subtitle" value="울산 현장 진단부터 시공까지"></label>
      <label>블로그 짧은 내용<textarea id="blogSummary">현장의 문제와 해결 과정을 한눈에 확인해 보세요.</textarea></label>
      <label>인스타그램 짧은 내용<textarea id="instagramSummary">반복되는 불편을 깔끔하게 해결했습니다.</textarea></label>
      <div class="row"><label>업체명<input id="business" value="오박사만능인테리어"></label><label>전화번호<input id="phone" value="010-8284-5584"></label></div>
      <label>강조 문구<input id="metric" value="하루 만에 해결"></label>
      <div class="status" id="status">최근 Beta 작업을 확인하는 중입니다.</div>
    </aside>
    <main class="groups">
      <section class="group"><div class="group-head"><h2>9:16 세로형 4종</h2><span>1080×1920</span></div><div class="grid-vertical" id="verticalGrid"></div></section>
      <section class="group"><div class="group-head"><h2>16:9 가로형 4종</h2><span>1280×720</span></div><div class="grid-horizontal" id="horizontalGrid"></div></section>
    </main>
  </div>
</div>
<script>
const templates=[
{id:'v1',name:'Neon Split',ratio:'vertical',w:1080,h:1920,theme:'theme1',tag:'현장 강조'},
{id:'v2',name:'Badge Focus',ratio:'vertical',w:1080,h:1920,theme:'theme2',tag:'문제 해결'},
{id:'v3',name:'Metric Focus',ratio:'vertical',w:1080,h:1920,theme:'theme3',tag:'숫자 강조'},
{id:'v4',name:'Story Focus',ratio:'vertical',w:1080,h:1920,theme:'theme4',tag:'스토리형'},
{id:'h1',name:'Versus',ratio:'horizontal',w:1280,h:720,theme:'theme5',tag:'전후 비교'},
{id:'h2',name:'Wide Badge',ratio:'horizontal',w:1280,h:720,theme:'theme6',tag:'해결 강조'},
{id:'h3',name:'Wide Neon',ratio:'horizontal',w:1280,h:720,theme:'theme7',tag:'현장 리포트'},
{id:'h4',name:'Wide Metric',ratio:'horizontal',w:1280,h:720,theme:'theme8',tag:'효과 강조'}
];
let imageUrl='';
let currentImage=null;
let currentJobId='';
let userTouched=false;
const $=id=>document.getElementById(id);
function values(){return{title:$('title').value,subtitle:$('subtitle').value,blogSummary:$('blogSummary').value,instagramSummary:$('instagramSummary').value,business:$('business').value,phone:$('phone').value,metric:$('metric').value}}
function card(t,index){return `<article class="card"><div class="meta"><strong>${t.name}</strong><button data-save="${t.id}">PNG 저장</button></div><div class="preview ${t.ratio} ${t.theme}"><canvas id="canvas-${t.id}" class="preview-canvas" width="${t.w}" height="${t.h}" aria-label="${t.name} 썸네일 미리보기"></canvas></div></article>`}
function mount(){verticalGrid.innerHTML=templates.filter(t=>t.ratio==='vertical').map(card).join('');horizontalGrid.innerHTML=templates.filter(t=>t.ratio==='horizontal').map(card).join('');document.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>saveOne(templates.find(t=>t.id===b.dataset.save))));render()}
function render(){const v=values();templates.forEach(t=>drawTemplateToCanvas($(`canvas-${t.id}`),t,v))}
function wrapLines(ctx,text,maxWidth,maxLines=3){const words=String(text||'').split(/\s+/).filter(Boolean),lines=[];let line='';for(const word of words){const next=line?`${line} ${word}`:word;if(ctx.measureText(next).width<=maxWidth)line=next;else{if(line)lines.push(line);line=word;if(lines.length>=maxLines-1)break}}if(line&&lines.length<maxLines)lines.push(line);return lines}
function drawWrapped(ctx,text,x,y,maxWidth,size,lineHeight,color,maxLines=3,align='left'){ctx.font=`900 ${size}px Arial`;ctx.textAlign=align;ctx.textBaseline='top';ctx.lineWidth=Math.max(5,size*.1);ctx.strokeStyle='rgba(0,0,0,.88)';ctx.fillStyle=color;const lines=wrapLines(ctx,text,maxWidth,maxLines);lines.forEach((line,i)=>{const yy=y+i*lineHeight;ctx.strokeText(line,x,yy,maxWidth);ctx.fillText(line,x,yy,maxWidth)});return lines.length}
function loadCurrentImage(src){return new Promise(resolve=>{if(!src){currentImage=null;resolve();return}const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{currentImage=img;resolve()};img.onerror=()=>{currentImage=null;resolve()};img.src=src})}
function drawTemplateToCanvas(c,t,v){if(!c)return;const ctx=c.getContext('2d'),W=c.width,H=c.height,vertical=t.ratio==='vertical';ctx.clearRect(0,0,W,H);ctx.fillStyle='#101c2f';ctx.fillRect(0,0,W,H);if(currentImage){const s=Math.max(W/currentImage.naturalWidth,H/currentImage.naturalHeight),w=currentImage.naturalWidth*s,h=currentImage.naturalHeight*s;ctx.drawImage(currentImage,(W-w)/2,(H-h)/2,w,h)}else{ctx.fillStyle='#61718a';ctx.font=`900 ${vertical?56:34}px Arial`;ctx.textAlign='center';ctx.fillText('배경 사진',W/2,H/2)}const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(0,0,0,.12)');g.addColorStop(.58,'rgba(0,0,0,.38)');g.addColorStop(1,'rgba(0,0,0,.88)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const accent={theme1:'#6feaff',theme2:'#ff4f75',theme3:'#ffe24c',theme4:'#ffffff',theme5:'#9a7cff',theme6:'#25d18a',theme7:'#6feaff',theme8:'#ff9d31'}[t.theme]||'#6feaff';const margin=vertical?58:44,summary=(t.id==='v1'||t.id==='v3'||t.id==='h1'||t.id==='h3')?v.blogSummary:v.instagramSummary,headline=(t.id.includes('3')||t.id.includes('4'))?`${v.metric} · ${v.title}`:v.title;ctx.font=`900 ${vertical?40:24}px Arial`;const tagW=ctx.measureText(t.tag).width+(vertical?34:24),tagH=vertical?58:38;ctx.fillStyle='rgba(0,0,0,.62)';ctx.beginPath();ctx.roundRect(margin,vertical?70:38,tagW,tagH,tagH/2);ctx.fill();ctx.fillStyle=accent;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(t.tag,margin+(vertical?17:12),(vertical?70:38)+tagH/2);const titleSize=vertical?82:54,titleY=vertical?650:190,titleLines=drawWrapped(ctx,headline,margin,titleY,W-margin*2,titleSize,vertical?92:62,(t.theme==='theme3'||t.theme==='theme8')?'#ffe24c':'#fff',vertical?3:2);drawWrapped(ctx,summary||v.subtitle,margin,titleY+titleLines*(vertical?92:62)+(vertical?24:12),W-margin*2,vertical?38:26,vertical?48:34,'#e5edf7',vertical?3:2);const bottomH=vertical?250:96;ctx.fillStyle='rgba(3,8,18,.86)';ctx.fillRect(0,H-bottomH,W,bottomH);drawWrapped(ctx,v.business,margin,H-bottomH+(vertical?42:20),vertical?W-margin*2:520,vertical?46:28,vertical?55:32,'#fff',1);drawWrapped(ctx,v.phone,vertical?margin:W-margin,H-bottomH+(vertical?120:48),vertical?W-margin*2:360,vertical?52:30,vertical?60:34,'#ffe24c',1,vertical?'left':'right')}
function saveOne(t){const c=$(`canvas-${t.id}`);if(!c)return;c.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${t.id}-${t.w}x${t.h}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')}
function cleanText(value,limit=72){return String(value||'').replace(/[#*_`>|\[\]]/g,' ').replace(/\s+/g,' ').trim().slice(0,limit)}
function shortChannel(value,limit=78){const text=String(value||'').replace(/https?:\/\/\S+/g,' ').replace(/#[^\s#]+/g,' ').replace(/^\s*\d+[.)]\s*/gm,'').replace(/[#*_`>|\[\]]/g,' ').replace(/\s+/g,' ').trim();const parts=text.split(/(?<=[.!?。])\s+/).filter(Boolean);return cleanText(parts.slice(0,2).join(' ')||text,limit)}
async function loadJob(jobId,force=false){if(!jobId||(!force&&jobId===currentJobId))return;const [jobRes,ctxRes]=await Promise.all([fetch(`/beta-api/jobs/${encodeURIComponent(jobId)}`,{credentials:'include',cache:'no-store'}),fetch(`/beta-api/shortform/jobs/${encodeURIComponent(jobId)}/context`,{credentials:'include',cache:'no-store'})]);if(!jobRes.ok||!ctxRes.ok)throw new Error('작업 상세 조회 실패');const job=(await jobRes.json()).job||{};const ctx=(await ctxRes.json()).context||{};if(!Array.isArray(ctx.images)||!ctx.images.length)throw new Error('작업 이미지 없음');const content=job.content||{},channels=content.channels||{},blog=channels.BLOG||{},insta=channels.INSTAGRAM||{};currentJobId=jobId;userTouched=false;$('title').value=cleanText(content.title||job.title||ctx.title_line_2||'StoryMaker Beta',46);$('subtitle').value=cleanText(content.description||ctx.title_line_2||'',54);$('blogSummary').value=shortChannel(blog.content||'',86)||'현장의 문제와 해결 과정을 확인해 보세요.';$('instagramSummary').value=shortChannel(insta.content||'',76)||'작업 현장의 변화를 짧게 확인해 보세요.';$('business').value=ctx.business_name||job.business?.name||'';$('phone').value=ctx.business_phone||job.business?.phone||'';$('metric').value=cleanText(ctx.title_line_2||content.title||'현장 해결',22);imageUrl=ctx.images[Math.floor(ctx.images.length/2)];await loadCurrentImage(imageUrl);$('status').textContent='';render()}
async function findLatestJob(){try{const res=await fetch('/beta-api/jobs',{credentials:'include',cache:'no-store'});if(!res.ok)throw new Error('작업 목록 조회 실패');const items=(await res.json()).items||[];for(const item of items.slice(0,12)){if(item.beta_job_id===currentJobId)return;try{const ctxRes=await fetch(`/beta-api/shortform/jobs/${encodeURIComponent(item.beta_job_id)}/context`,{credentials:'include',cache:'no-store'});if(!ctxRes.ok)continue;const ctx=(await ctxRes.json()).context||{};if((ctx.images||[]).length){await loadJob(item.beta_job_id);return}}catch(_){}}$('status').textContent='이미지가 있는 최근 Beta 작업을 찾지 못했습니다.'}catch(error){$('status').textContent=`최근 작업 자동 연결 실패: ${error.message}`}}
$('imageInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;if(imageUrl&&imageUrl.startsWith('blob:'))URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(f);userTouched=true;await loadCurrentImage(imageUrl);$('status').textContent='';render()});['title','subtitle','blogSummary','instagramSummary','business','phone','metric'].forEach(id=>$(id).addEventListener('input',()=>{userTouched=true;render()}));$('saveAll').addEventListener('click',async()=>{for(const t of templates){await saveOne(t);await new Promise(r=>setTimeout(r,180))}$('status').textContent='8종 저장 요청 완료'});mount();findLatestJob();setInterval(findLatestJob,6000);
</script>
</body>
</html>
